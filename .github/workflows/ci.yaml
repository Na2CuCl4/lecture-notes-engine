name: Engine validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Markdown conversion dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: npm run typecheck
      - run: npm test
      - name: Build one demo website
        run: npm run build -- --projects projects.yaml --project calculus-demo --out .work/ci-releases --no-publish
