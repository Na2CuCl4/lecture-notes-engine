# Copy into the CONTENT repository only after its migration/deployment is ready.
# This file is documentation, not an active workflow in the engine repository.
# The self-hosted runner must already have an engine checkout + its .env file,
# and use the same Compose project/volumes as the running web and worker.
name: Publish lecture content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lecture-content-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, lecture-notes]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build a complete release and publish atomically
        env:
          # Configure this repository variable with the server's engine path.
          ENGINE_DIRECTORY: ${{ vars.ENGINE_DIRECTORY }}
          # The server projects manifest must name this ID and a stable source mount.
          PROJECT_ID: ${{ vars.LECTURE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENGINE_DIRECTORY"
          test -n "$PROJECT_ID"
          cd "$ENGINE_DIRECTORY"
          # Configure the project's read-only bind mount to this content repository's
          # stable checkout on the server. Do not expose the container's engine checkout
          # as a content source, and do not mutate another project's checkout here.
          docker compose run --rm builder \
            npm run build -- --projects /projects.yaml --project "$PROJECT_ID" --out /releases --book --local-worker
      - name: Verify running service
        run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3000/healthz
